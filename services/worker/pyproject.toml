[project]
name = "eaios-worker"
version = "0.1.0"
description = "Celery background worker — tenant-attributed job execution"
requires-python = "==3.12.*"
dependencies = [
    "eaios-core",
    "celery[redis]==5.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eaios_worker"]
