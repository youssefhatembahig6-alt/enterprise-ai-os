[project]
name = "eaios-core"
version = "0.1.0"
description = "Shared domain: models, deterministic identifiers, fingerprinting, tenant key builders"
requires-python = "==3.12.*"

# Versions are pinned exactly, not floated. Generated content depends on library
# data that changes between releases; an unpinned upgrade silently changes the
# dataset and breaks the determinism guarantee (spec FR-012b).
dependencies = [
    "sqlalchemy==2.0.36",
    "psycopg[binary]==3.2.3",
    "pydantic==2.10.5",
    "pydantic-settings==2.7.1",
    "structlog==24.4.0",
    "redis==5.2.1",
    "qdrant-client==1.12.2",
    "minio==7.2.13",
    # Needed by `clients.stores.check_worker`, which reaches the background worker
    # over the broker. The API depends on core and therefore gains it; the worker
    # already declared it independently.
    "celery[redis]==5.4.0",
    # Backs `eaios_core.passwords` (spec 003 FR-002). Declared here rather than in the
    # API because two members need it — the API verifies and the seed's `credentials`
    # command hashes — and `scripts/seed` may not import from `apps/api`.
    "argon2-cffi==25.1.0",
    # ---------------------------------------------------------------------
    # Feature 004: the local BGE-M3 runtime (spec 004 FR-011c, FR-035p).
    #
    # Owned by core *by decision*, not by accident of layout. All three consumers
    # legitimately embed: the API embeds retrieval queries, the seed embeds documents
    # during ingestion, and the worker executes tenant-attributed indexing. All three
    # images install `./packages/core`, so declaring it here is what puts one identical
    # runtime in front of all of them.
    #
    # `uv.lock` covers the root development environment; Docker resolves the identical
    # exact pin from this file. `tests/unit/test_packaging_layout.py` fails the build if
    # the two ever drift apart.
    #
    # Deliberately NOT a `benchmarks/pyproject.toml`: nothing installs from such a file
    # — there is no uv workspace here and no benchmark image — so a pin placed there
    # would be inert while looking authoritative.
    #
    # Imported lazily, inside the embedder's constructor. A top-level import would pull
    # ~2.5 GB of runtime into every process that touches core, including the ones that
    # never embed, and would break the bare-checkout boundary that
    # `tests/unit/test_phase0_bare_checkout.py` enforces.
    "torch==2.5.1",
    "transformers==4.47.1",
    # XLM-RoBERTa is BGE-M3's base; its tokenizer needs sentencepiece to convert.
    "sentencepiece==0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eaios_core"]
