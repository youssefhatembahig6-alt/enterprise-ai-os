[project]
name = "eaios"
version = "0.1.0"
description = "Enterprise AI Operating System — foundation monorepo"
requires-python = "==3.12.*"

# The four local packages (packages/core, apps/api, services/worker, scripts/seed)
# each keep their own pyproject.toml — those are what the Docker images install.
# Locally they are resolved through `tool.pytest.ini_options.pythonpath` below
# rather than being built and installed, so a developer environment needs no build
# step for first-party code. Versions are pinned exactly: generated content depends
# on library data that changes between releases (spec FR-012b).
dependencies = [
    "sqlalchemy==2.0.36",
    "psycopg[binary]==3.2.3",
    "alembic==1.14.0",
    # Backs Pydantic's EmailStr on the public contact form (spec 002 FR-019).
    "email-validator==2.2.0",
    "pydantic==2.10.5",
    "pydantic-settings==2.7.1",
    "structlog==24.4.0",
    "redis==5.2.1",
    "qdrant-client==1.12.2",
    "minio==7.2.13",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    # Feature 003. Argon2id is the first choice for new password storage, and the
    # encoded output carries its own salt and parameters — so `verify` reads them from
    # the stored value rather than from configuration that could drift away from it
    # (spec 003 FR-002, research R1). `passlib` was rejected: it is unmaintained since
    # 2020 and breaks against modern bcrypt, which is the wrong risk to accept in the
    # credential layer specifically.
    "argon2-cffi==25.1.0",
    # Token mint and verify. Verification pins `algorithms=[...]` explicitly; an
    # unpinned verifier accepts `alg: none` and accepts an RS256 public key presented
    # as an HMAC secret (research R2).
    "PyJWT==2.10.1",
    "celery[redis]==5.4.0",
    "Faker==33.3.0",
    "Jinja2==3.1.5",
    "typer==0.15.1",
    # Feature 004: the local BGE-M3 runtime. One identical pin here and in
    # `packages/core/pyproject.toml` — this file is the developer and benchmark
    # environment, that one is what the three Docker images install. See the longer
    # note there for why core owns it (spec 004 FR-011c, FR-035p).
    "torch==2.5.1",
    "transformers==4.47.1",
    "sentencepiece==0.2.0",
]

[tool.uv]
package = false

# ---------------------------------------------------------------------------
# CPU-only PyTorch (spec 004 FR-011c)
# ---------------------------------------------------------------------------
# Embedding runs on the **local CPU**; the reference machine has no CUDA stack at all
# (benchmarks/phase0/ENVIRONMENT.md). The default PyPI `torch` wheel bundles the CUDA
# runtime — thirteen `nvidia-*` distributions plus `triton`, gigabytes of it — into
# every image that installs `packages/core`, which is the API, the worker and the seed.
# None of them can use a GPU, so that payload is pure weight.
#
# Pinning the official CPU index resolves the identical `2.5.1+cpu` build everywhere:
# the developer environment through `uv.lock`, and all three containers through their
# own `--index-url`. `tests/unit/test_packaging_layout.py` fails the build if a CUDA
# distribution reappears in the lock or if a Dockerfile could resolve the default build.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "httpx==0.28.1",
    "ruff==0.9.2",
    "mypy==1.14.1",
]

# ---------------------------------------------------------------------------
# Lint / type configuration (T007)
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
# `.` so `benchmarks` resolves as first-party. Without it the Phase 0 harness imports
# sort into the third-party block, which is both wrong and a churn source every time
# someone runs `ruff --fix`.
src = ["packages/core/src", "apps/api/src", "services/worker/src", "scripts/seed/src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM", "RUF"]
# RUF001/RUF002/RUF003 flag en dashes and multiplication signs in strings, docstrings and
# comments; that check targets identifier confusion, not prose, and the characters are
# intentional throughout this codebase's documentation.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# The seed CLI legitimately prints to stdout — that output is a contract.
# Typer expresses CLI defaults as call results in the signature; that is the
# framework idiom, not a mutable-default bug.
"scripts/seed/src/eaios_seed/cli.py" = ["T20", "B008"]
# selfcheck is a CLI: its stdout is the fingerprint CI compares.
"packages/core/src/eaios_core/selfcheck.py" = ["T20"]
# The Phase 0 benchmark is a hand-run CLI. Its stdout is the result table an operator
# reads and copies into GATE.md — that output is the contract, not debug noise. The
# launcher is the same CLI's front door and reports the same way.
"benchmarks/phase0/__main__.py" = ["T20"]
"benchmarks/run_phase0.py" = ["T20"]
# A notebook communicates by printing; that is what a notebook is. Ruff still checks it
# for real defects, which is why it is ignored per-rule rather than excluded outright.
"infrastructure/colab/*.ipynb" = ["T20"]
"tests/**" = ["DTZ", "S101"]
# `Depends(...)` in a parameter default is the FastAPI idiom, not a mutable default.
"apps/api/src/eaios_api/health/*.py" = ["B008"]
"apps/api/src/eaios_api/public/*.py" = ["B008"]
"apps/api/src/eaios_api/auth/*.py" = ["B008"]
"apps/api/src/eaios_api/authz/*.py" = ["B008"]
"apps/api/src/eaios_api/me/*.py" = ["B008"]
"apps/api/src/eaios_api/hr/*.py" = ["B008"]
# `PgUUID` aliases a class that ruff reads as a constant because of its casing.
"packages/core/src/eaios_core/models/*.py" = ["N811"]
# Migrations use the same PgUUID alias as the models they mirror.
"apps/api/alembic/versions/*.py" = ["N811"]
# These shadow stdlib module names deliberately: they are the project's own
# logging configuration and its platform-domain models, and renaming them would
# make every import read worse than the shadowing costs.
"packages/core/src/eaios_core/logging.py" = ["A005"]
"packages/core/src/eaios_core/models/platform.py" = ["A005"]
"apps/api/src/eaios_api/logging.py" = ["A005"]

[tool.ruff.lint.pycodestyle]
max-line-length = 100

[tool.ruff.lint.pydocstyle]
convention = "google"

# En dashes and multiplication signs in prose are intentional. Flagging them as
# "ambiguous" is aimed at identifier confusion, not documentation.
[tool.ruff.lint.flake8-implicit-str-concat]
allow-multiline = true

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

# Wall-clock access is banned in generation code (FR-012). Enforcement lives in
# tests/unit/test_no_wallclock.py, which walks the AST of every file under
# packages/core and scripts/seed — a lint rule cannot express the per-directory
# exemption that the clock and manifest modules legitimately need.

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
mypy_path = [
    "packages/core/src",
    "apps/api/src",
    "services/worker/src",
    "scripts/seed/src",
]

[[tool.mypy.overrides]]
# `transformers` and `torch` ship no py.typed marker, so mypy cannot see through them.
# They are wrapped behind narrow first-party interfaces (`Tokenizer`, `_Backend`), which
# is where the typing that matters lives.
module = [
    "faker.*",
    "qdrant_client.*",
    "minio.*",
    "celery.*",
    "structlog.*",
    "transformers.*",
    "torch.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Test configuration (T016)
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "packages/core/src",
    "apps/api/src",
    "services/worker/src",
    "scripts/seed/src",
]
markers = [
    "unit: pure logic, no external services",
    "integration: requires the Docker Compose stack",
    "security: tenant isolation and access-control invariants",
    "e2e: full clean-environment lifecycle",
]
addopts = "-ra --strict-markers"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning"]
