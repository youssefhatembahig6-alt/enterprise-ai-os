name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  # Pinned so number and date formatting cannot vary by runner (spec FR-012a).
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  TZ: UTC

jobs:
  # ---------------------------------------------------------------------------
  # Fast feedback: pure-logic checks that need no services.
  # This is where the determinism primitives are proven.
  # ---------------------------------------------------------------------------
  unit:
    name: unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      # Multi-OS is not decoration: SC-002 claims the dataset is identical on
      # every team member's machine, and this matrix is the only thing that
      # exercises that claim (spec FR-047b).
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify line endings survived checkout
        shell: bash
        run: |
          # A CRLF here would silently change every generated document's bytes.
          if grep -qU $'\r' packages/core/src/eaios_core/__init__.py; then
            echo "::error::CRLF detected — .gitattributes is not being honoured"
            exit 1
          fi
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.18"
          enable-cache: true
      - run: uv sync
      - run: uv run python -m ruff check .
      # `scripts/seed/src` was omitted here while `make lint` checked it — leaving
      # the largest package, and the one every determinism guarantee runs through,
      # as the only place a type regression could land without blocking the change.
      - run: uv run python -m mypy packages/core/src apps/api/src services/worker/src scripts/seed/src
      - run: uv run python -m pytest tests/unit -m unit -v

      - name: Compute the platform determinism fingerprint
        shell: bash
        env:
          PYTHONPATH: packages/core/src
        run: uv run python -m eaios_core.selfcheck > fingerprint-${{ matrix.os }}.txt

      - uses: actions/upload-artifact@v4
        with:
          name: fingerprint-${{ matrix.os }}
          path: fingerprint-${{ matrix.os }}.txt

  # ---------------------------------------------------------------------------
  # The cross-platform comparison SC-002 actually depends on.
  #
  # Before this job existed, the fingerprint was computed on Ubuntu only, so the
  # "identical on every team member's machine" claim rested on a check that could
  # never fail. GitHub's Windows runners cannot run Linux containers, so the full
  # seed cannot run cross-OS — but the platform-sensitive parts of generation are
  # pure Python (line endings, encoding, locale, ordering) and those are compared
  # here (converge finding F2).
  # ---------------------------------------------------------------------------
  determinism:
    name: cross-platform determinism
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fingerprint-*
          merge-multiple: true

      # Windows Python writes `\r\n`, so comparing raw bytes reported two identical
      # digests as divergent (2026-08-10). Each artifact must hold exactly one line;
      # only a trailing CR is stripped, and what remains must be the digest itself —
      # so empty, truncated, split, or multi-line artifacts fail instead of comparing
      # equal to each other.
      - name: Fingerprints must be identical across platforms
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          files=(fingerprint-*.txt)
          if [ "${#files[@]}" -lt 2 ]; then
            echo "::error::expected at least two platform fingerprints, found ${#files[@]}"
            exit 1
          fi

          echo "--- reported ---"
          digests=()
          for f in "${files[@]}"; do
            mapfile -t lines < "$f"
            if [ "${#lines[@]}" -ne 1 ]; then
              echo "::error::$f must hold exactly one line, found ${#lines[@]}"
              exit 1
            fi
            value="${lines[0]%$'\r'}"
            printf '%s  %s\n' "${value:-<empty>}" "$f"
            if [[ ! "$value" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::$f is not a 64-character lowercase SHA-256 digest"
              exit 1
            fi
            digests+=("$value")
          done

          unique=$(printf '%s\n' "${digests[@]}" | sort -u | wc -l)
          if [ "$unique" -ne 1 ]; then
            echo "::error::platform fingerprints diverge — generation is not deterministic across OSes (SC-002)"
            exit 1
          fi
          echo "All platforms agree: ${digests[0]}"

  # ---------------------------------------------------------------------------
  # Full stack: migrations, seed, isolation, coherence, determinism.
  # ---------------------------------------------------------------------------
  stack:
    name: integration + security + e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.18"
          enable-cache: true
      - run: uv sync

      # Node and pnpm for the browser sweeps at the end of this job. Without
      # them the Playwright step fails on a missing runtime rather than on
      # anything it was written to check.
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Start the stack
        run: |
          cp infrastructure/.env.example .env
          make up

      - name: Migrations are reversible
        run: uv run python -m pytest tests/integration/test_migrations.py -m integration -v

      - name: Seed from empty
        run: |
          docker compose -f infrastructure/docker-compose.yml --env-file .env \
            run --rm --no-deps -T seed seed --profile smoke

      # Spec 003 FR-002a. The generator leaves `password_hash` unset by design, so a
      # seeded environment has a complete dataset and nobody who can sign in. Without
      # this step every authentication test skips itself with "no credentials
      # provisioned" and the job reports success having checked none of them.
      - name: Provision credentials
        run: |
          docker compose -f infrastructure/docker-compose.yml --env-file .env \
            run --rm --no-deps -T seed credentials

      - name: Integrity, coherence, and provenance
        run: uv run python -m pytest tests/integration -m integration -v

      # Named separately from the rest of the security suite so a failure here says
      # what it is. This is the suite spec 003 FR-037 requires to block the change, and
      # Constitution Principle VIII requires unauthorized information leakage to
      # measure 0% on — a non-zero result blocks merge, phase gates, and stretch work.
      - name: Authentication and authorization (FR-037, Principle VIII)
        run: |
          uv run python -m pytest -m security -v \
            tests/security/test_login_enumeration.py \
            tests/security/test_session_lifecycle.py \
            tests/security/test_token_tampering.py \
            tests/security/test_request_supplied_claims.py \
            tests/security/test_authorize_before_read.py \
            tests/security/test_manager_scope.py \
            tests/security/test_cross_tenant_authenticated.py \
            tests/security/test_authz_audit.py \
            tests/security/test_credential_never_logged.py \
            tests/security/test_password_hash_column_unused.py

      - name: Tenant isolation
        run: uv run python -m pytest tests/security -m security -v

      # `test_clean_startup.py` is excluded here and runs in its own job below. It
      # opens with `docker compose down -v`, and it sorts first — so in one combined
      # step it destroyed the dataset and the credentials that the two steps above had
      # just provisioned. What followed was worse than a failure: `credentials` skipped
      # itself with "environment not seeded", and the authentication lifecycle suite
      # reported green having run nothing.
      #
      # EAIOS_NO_SKIPS makes that unrepeatable. Every skip guard in these files is an
      # "is the stack up?" check, and in CI the stack is up by construction.
      - name: Determinism and lifecycle
        env:
          EAIOS_NO_SKIPS: "1"
        run: |
          uv run python -m pytest tests/e2e -m e2e -v \
            --ignore=tests/e2e/test_clean_startup.py

      - name: Public content carries nothing sensitive
        run: uv run python -m pytest tests/security/test_public_content.py -m security -v

      # The committed API types must match the API that is running (spec 002
      # plan: contracts/). `src/generated/api.ts` is committed on purpose and
      # regenerated by hand, so nothing otherwise notices when a schema change ships
      # without it — and `pnpm typecheck` in the `web` job passes against a stale
      # file quite happily. Placed before the browser suite so a Playwright failure
      # cannot mask a contract that has drifted.
      #
      # Spec 003 needs no change here: `openapi-typescript` reads the whole
      # `/openapi.json`, so the nine authenticated routes are covered by the same
      # regeneration and the same diff.
      - name: Committed API types match the running API
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @eaios/contracts verify

      # The public website's browser-side verification (spec 002 FR-053, FR-055).
      # Runs here rather than in the `web` job because it needs the stack and a
      # seeded database — the axe, keyboard, responsive, and metadata sweeps all
      # assert against real content, and against an empty site they would pass
      # while checking nothing.
      - name: Public website end-to-end, accessibility, and metadata
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @eaios/web exec playwright install --with-deps chromium
          pnpm --filter @eaios/web exec playwright test

      - name: Fingerprint matches the committed known-good value
        # Without this step, verification only proves the dataset agrees with its
        # own manifest — a generator change would produce a new dataset and a new
        # manifest that match each other perfectly (spec FR-017a).
        run: |
          docker compose -f infrastructure/docker-compose.yml --env-file .env \
            run --rm --no-deps -T seed verify --profile smoke

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f infrastructure/docker-compose.yml logs

  # ---------------------------------------------------------------------------
  # One command, from nothing (spec 001 FR-002, FR-004, SC-001).
  #
  # Its own job because the test tears the stack down to bare volumes and brings it
  # back — which is precisely the thing being measured, and precisely why it cannot
  # share a runner with steps that need a seeded database. It ran inside the `stack`
  # job until it was found deleting that job's data out from under the six steps
  # after it.
  # ---------------------------------------------------------------------------
  clean-startup:
    name: clean startup (SC-001)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.18"
          enable-cache: true
      - run: uv sync

      - name: One command, from a torn-down state
        env:
          EAIOS_NO_SKIPS: "1"
        run: |
          cp infrastructure/.env.example .env
          uv run python -m pytest tests/e2e/test_clean_startup.py -m e2e -v

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f infrastructure/docker-compose.yml logs

  # ---------------------------------------------------------------------------
  # The full dataset — the CLI default, what `make seed` produces, and the one a
  # demo runs on.
  #
  # Every other job seeds `smoke`, so until now the numbers the specification
  # actually commits to (FR-020b's volume table, SC-005's 190–210 employees) were
  # never measured, and the committed `full` fingerprint was never compared against
  # a live environment. Kept as its own job because it is slower than smoke and
  # should not gate the fast feedback the `stack` job gives.
  # ---------------------------------------------------------------------------
  full-dataset:
    name: full profile (FR-020b, SC-005)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.18"
          enable-cache: true
      - run: uv sync

      - name: Start the stack
        run: |
          cp infrastructure/.env.example .env
          make up

      - name: Seed the full dataset
        run: |
          docker compose -f infrastructure/docker-compose.yml --env-file .env \
            run --rm --no-deps -T seed seed --profile full

      - name: Volumes, composition, and hierarchy
        # test_org_hierarchy.py carries the named-composition assertions (the eight
        # departments and three offices by name), and test_volume_targets.py carries
        # SC-005's range, which skips itself on any profile but this one.
        run: |
          uv run python -m pytest -m integration -v \
            tests/integration/test_volume_targets.py \
            tests/integration/test_org_hierarchy.py \
            tests/integration/test_document_ownership.py

      - name: Fingerprint matches the committed full-profile value
        run: |
          docker compose -f infrastructure/docker-compose.yml --env-file .env \
            run --rm --no-deps -T seed verify --profile full

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f infrastructure/docker-compose.yml logs

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The public site builds here so a type or route error fails the web job
      # rather than the stack job, where it would read as an infrastructure fault.
      - run: pnpm --filter @eaios/web build
