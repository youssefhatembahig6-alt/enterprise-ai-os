[project]
name = "eaios-api"
version = "0.1.0"
description = "FastAPI service — health, readiness, dataset provenance"
requires-python = "==3.12.*"
dependencies = [
    "eaios-core",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "alembic==1.14.0",
    # Backs Pydantic's EmailStr on the public contact form (spec 002 FR-019) and the
    # sign-in body (spec 003).
    "email-validator==2.2.0",
    # Mints and verifies session credentials (spec 003 FR-003). Only the API does this,
    # so unlike the password hasher it stays here rather than moving down into core.
    "PyJWT==2.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eaios_api"]
